		<main>
			<!-- Page Header -->
			<div class="page-header">
				<h1>Say Hi!</h1>
				<p>
					If you are here, it means you have something to tell me. If you want
					to send me an email, please fill out the following form. Thank you
					very much!
				</p>
			</div>

			<!-- Contact Form -->
			<div class="contact-form-container">
				<form
					class="contact-form"
					action="https://formspree.io/f/mnqkkvaj"
					method="POST"
				>
					<div class="form-group">
						<label for="name">Nome *</label>
						<input
							type="text"
							id="name"
							name="name"
							required
							placeholder="Your name"
						/>
					</div>

					<div class="form-group">
						<label for="email">Email *</label>
						<input
							type="email"
							id="email"
							name="email"
							required
							placeholder="your.email@example.com"
						/>
					</div>

					<div class="form-group">
						<label for="subject">Subject</label>
						<input
							type="text"
							id="subject"
							name="subject"
							placeholder="Ex. Request for information"
						/>
					</div>

					<div class="form-group">
						<label for="message">Message *</label>
						<textarea
							id="message"
							name="message"
							required
							placeholder="Your message"
						></textarea>
					</div>

					<button type="submit" class="submit-button">
						<svg fill="currentColor" viewBox="0 0 20 20">
							<path
								d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"
							/>
						</svg>
						Send Message
					</button>
				</form>
			</div>
